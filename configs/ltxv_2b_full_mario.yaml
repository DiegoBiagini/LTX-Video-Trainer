# LTXV Full Model Fine-tuning Configuration

# Model configuration
model:
  model_source: "LTXV_2B_0.9.5" # Options: "LTXV_13B_097_DEV", "LTXV_2B_0.9.6_DEV", "LTXV_2B_0.9.5", "LTXV_2B_0.9.1", "LTXV_2B_0.9.0", or a HF repo/local path
  training_mode: "full" # Options: "lora" or "full"
  load_checkpoint: null # Path to checkpoint file or directory to resume from. If directory, latest checkpoint will be used.

# Conditioning configuration
conditioning:
  mode: "none" # Options: "none", "reference_video"
  first_frame_conditioning_p: 0.1

# Optimization configuration
optimization:
  learning_rate: 1e-5 # Lower learning rate for full fine-tuning
  steps: 100000
  batch_size: 4
  gradient_accumulation_steps: 2
  max_grad_norm: 1.0
  optimizer_type: "adamw8bit" # Use 8-bit optimizer to save memory
  scheduler_type: "cosine_with_restarts" # Options: "constant", "linear", "cosine", "cosine_with_restarts", "polynomial"
  scheduler_params: {}
  enable_gradient_checkpointing: false # Enable to save memory

# Acceleration optimization
acceleration:
  mixed_precision_mode: "bf16" # Options: "no", "fp16", "bf16"
  #quantization: "null" # Disable quantization for full fine-tuning
  load_text_encoder_in_8bit: false # Load text encoder in 8-bit precision to save memory
  compile_with_inductor: false
  compilation_mode: "reduce-overhead" # Options: "default", "reduce-overhead", "max-autotune"

# Data configuration
data:
  preprocessed_data_root: "/mnt/B/Storage_10/dev_diego/WM/splits"
  num_dataloader_workers: 2

# Validation configuration
validation:
  prompts:
    - "In the video, Mario is seen running across a level with a clear blue sky and green hills in the background. He jumps over obstacles and collects coins while avoiding enemies like Goombas."
    - "In the video, Mario is seen running across a level with a clear blue sky and green hills in the background. He jumps over obstacles and collects coins while avoiding enemies like Goombas."
  negative_prompt: "worst quality, inconsistent motion, blurry, jittery, distorted"
  images:
    - "/mnt/B/Storage_10/dev_diego/WM/test_images/000206.png"
    - "/mnt/B/Storage_10/dev_diego/WM/test_images/000948.png" # Set to a list of image paths to use first-frame conditioning, or null to disable
  video_dims: [512, 512, 121] # [width, height, frames]
  seed: 42
  inference_steps: 50
  interval: 1000 # Set to null to disable validation
  videos_per_prompt: 1
  guidance_scale: 3.5

# Checkpoint configuration
checkpoints:
  interval: 1000 # Save a checkpoint every N steps, set to null to disable
  keep_last_n: -1 # Keep only the N most recent checkpoints, set to -1 to keep all

# Flow matching configuration
flow_matching:
  timestep_sampling_mode: "shifted_logit_normal" # Options: "uniform", "shifted_logit_normal"
  timestep_sampling_params: {}

# HuggingFace Hub configuration
hub:
  push_to_hub: false # Whether to push the model weights to the Hugging Face Hub
  hub_model_id: null # Hugging Face Hub repository ID (e.g., 'username/repo-name'). Must be provided if `push_to_hub` is set to True
# W&B configuration
wandb:
  enabled: true  # Set to true to enable W&B logging
  project: "MarioWM"
  entity: ''  # Your W&B username or team
  tags: []
  log_validation_videos: true

# General configuration
seed: 42
output_dir: "/mnt/B/Storage_10/dev_diego/WM/outputs/ltxv_full_finetune"
